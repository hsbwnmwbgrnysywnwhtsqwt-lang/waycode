<!--
  WayCode activity-bar / command icon: the logo, traced to vector paths and
  fitted to the square 24x24 slot VS Code gives this slot.

  Strokes are slightly thickened relative to media/logo.svg because the logo's
  hairlines wash out at 1x (24px); at 2x (Retina, 48px) the interlace reads
  clearly.

  Filled WHITE, not `currentColor`. An SVG loaded as an image has no inherited
  colour to take, so `currentColor` falls back to black — which is invisible on
  a dark activity bar. Where VS Code masks this icon the theme colour wins
  anyway, so white is the safe value in both cases. Note the flip side: on a
  LIGHT theme, any context that draws this as a plain image will show white on
  white. Use #C5C5C5 instead if that ever matters.
-->
